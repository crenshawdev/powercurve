[package]
name = "powercurve"
version = "0.1.0-alpha.1"
authors = ["John Crenshaw"]
edition = "2021"
rust-version = "1.93.0"

[workspace]
members = [ "zbus" ]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
concat-in-place = "1"
fern = "0.6"
futures-lite = "2"
intel-pstate = "1"
libc = "0.2"
log = "0.4"
once_cell = "1"
serde.workspace = true
sysfs-class = { git = "https://github.com/pop-os/sysfs-class" }
powercurve-zbus = { path = "zbus" }
thiserror = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt", "time", "signal"] }
zbus = { version = "3", default-features = false, features = [ "tokio"] }
zvariant = "3"

[dev-dependencies]
env_logger = "0.11"

[lints.clippy]
match_like_matches_macro = "allow"
missing_safety_doc = "allow"
single_match = "allow"
