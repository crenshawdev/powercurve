# All fans go to max when either threshold is hit.
critical_cpu_temp = 80
critical_gpu_temp = 75

# Smooth fan curve with tight steps through the idle range (~45C) and a
# gentle ramp into load. Always-on floor at 10% avoids start/stop cycling.
[[curve]]
temp = 30.0
duty = 10

[[curve]]
temp = 36.0
duty = 12

[[curve]]
temp = 40.0
duty = 18

[[curve]]
temp = 43.0
duty = 22

[[curve]]
temp = 46.0
duty = 26

[[curve]]
temp = 50.0
duty = 30

[[curve]]
temp = 54.0
duty = 38

[[curve]]
temp = 58.0
duty = 45

[[curve]]
temp = 62.0
duty = 55

[[curve]]
temp = 66.0
duty = 68

[[curve]]
temp = 70.0
duty = 80

[[curve]]
temp = 75.0
duty = 100

# pwm1 = CPU fan, pwm2 = intake, pwm3 = GPU fan
[[channels]]
pwm = "pwm1"
source = "cpu"

[[channels]]
pwm = "pwm2"
source = "all"

[[channels]]
pwm = "pwm3"
source = "gpu"
