name: Build and deploy to pacman repo

on:
  push:
    tags:
      - 'v*'

jobs:
  build-deploy:
    runs-on: arch-local
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package
        run: |
          export CARGO_TARGET_DIR=target
          makepkg -sf --noconfirm

      - name: Deploy to arch repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          pkg=$(ls vintagetechie-power-git-*-x86_64.pkg.tar.zst | head -1)

          rm -rf /tmp/repo
          git clone --branch pages \
            "https://VintageTechie:${DEPLOY_TOKEN}@codeberg.org/VintageTechie/vintagetechie-arch-repo.git" \
            /tmp/repo

          rm -f /tmp/repo/x86_64/vintagetechie-power-git-*.pkg.tar.zst
          cp "$pkg" /tmp/repo/x86_64/

          cd /tmp/repo/x86_64
          repo-add vintagetechie-arch-repo.db.tar.gz "$pkg"

          cd /tmp/repo
          git config user.name "VintageTechie"
          git config user.email "noreply@codeberg.org"
          git add -A
          git commit -m "update vintagetechie-power-git to ${tag}"
          git push origin pages
