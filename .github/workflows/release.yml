name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-24.04
    outputs:
      tag_sha: ${{ steps.release.outputs.tag_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq libdbus-1-dev pkg-config

      - name: Validate release tag and package version
        id: release
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match vX.Y.Z: $TAG" >&2
            exit 1
          fi

          git show-ref --verify --quiet "refs/tags/$TAG"
          tag_sha="$(git rev-list --max-count=1 "$TAG")"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "release tag must point to a commit on origin/main: $TAG" >&2
            exit 1
          fi

          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "powercurve") | .version')"
          test "v$version" = "$TAG"

          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run release tests
        run: cargo test --locked --workspace

  package-deb:
    name: Debian package
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev pkg-config

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked --version 3.7.0

      - name: Point historical package metadata to GitHub
        run: |
          sed -i \
            's|repository = "https://gitlab.com/vintagetechie/powercurve"|repository = "https://github.com/crenshawdev/powercurve"|' \
            Cargo.toml
          sed -i \
            's|https://gitlab.com/vintagetechie/powercurve/-/releases|https://github.com/crenshawdev/powercurve/releases/latest|' \
            README.md

      - name: Build Debian package
        run: |
          cargo build --locked --release
          cargo deb --no-build
          mkdir -p dist
          cp target/debian/*.deb dist/
          test "$(find dist -maxdepth 1 -name '*.deb' -type f | wc -l)" -eq 1

      - name: Upload Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debian-package
          path: dist/*.deb
          if-no-files-found: error

  package-arch:
    name: Arch package
    needs: validate
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install build dependencies
        run: pacman -Syu --noconfirm dbus git rust

      - name: Pin PKGBUILD to the release commit
        env:
          TAG_SHA: ${{ needs.validate.outputs.tag_sha }}
        run: |
          sed -i -E \
            -e 's|^url=.*$|url="https://github.com/crenshawdev/powercurve"|' \
            -e "s|^source=.*$|source=(\"git+https://github.com/crenshawdev/powercurve.git#commit=${TAG_SHA}\")|" \
            PKGBUILD
          grep -F 'url="https://github.com/crenshawdev/powercurve"' PKGBUILD
          grep -F "#commit=${TAG_SHA}" PKGBUILD

      - name: Build Arch package
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -s /bin/bash -c "cd '$GITHUB_WORKSPACE' && makepkg -f --noconfirm"
          mkdir -p dist
          cp powercurve-git-[0-9]*.pkg.tar.zst dist/
          test "$(find dist -maxdepth 1 -name 'powercurve-git-[0-9]*.pkg.tar.zst' -type f | wc -l)" -eq 1

      - name: Upload Arch package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - validate
      - package-deb
      - package-arch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-package"
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          cd dist
          sha256sum ./* > SHA256SUMS

      - name: Publish release and attach packages
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: PowerCurve ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: dist/*
